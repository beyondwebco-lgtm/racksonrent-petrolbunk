<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.18)"/>
      <stop offset="60%" stop-color="rgba(15,23,42,0.06)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="kiwiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Soft Shadow -->
  <ellipse cx="200" cy="315" rx="140" ry="25" fill="url(#shadowGrad)"/>

  <!-- Bowl Base Outer -->
  <ellipse cx="200" cy="275" rx="130" ry="45" fill="#94A3B8" opacity="0.3"/>
  
  <!-- Bowl Body -->
  <path d="M 70,190 C 70,300 330,300 330,190 C 330,175 70,175 70,190 Z" fill="url(#bowlGrad)"/>
  
  <!-- Bowl Rim Inner -->
  <ellipse cx="200" cy="185" rx="130" ry="40" fill="#F8FAFC"/>
  <ellipse cx="200" cy="188" rx="122" ry="35" fill="#FEF08A"/>

  <!-- Fruit Bowl Contents -->
  <!-- Strawberry slices -->
  <path d="M 140,165 Q 160,140 185,160 Q 165,190 140,165 Z" fill="url(#strawberryGrad)"/>
  <circle cx="160" cy="162" r="1.5" fill="#FEF9C3"/>
  <circle cx="168" cy="170" r="1.5" fill="#FEF9C3"/>

  <path d="M 215,155 Q 240,135 255,160 Q 230,185 215,155 Z" fill="url(#strawberryGrad)"/>
  <circle cx="232" cy="155" r="1.5" fill="#FEF9C3"/>

  <!-- Kiwi Slices -->
  <circle cx="130" cy="190" r="24" fill="url(#kiwiGrad)"/>
  <circle cx="130" cy="190" r="10" fill="#FEF9C3"/>
  <circle cx="130" cy="182" r="1.5" fill="#1E293B"/>
  <circle cx="137" cy="190" r="1.5" fill="#1E293B"/>
  <circle cx="130" cy="197" r="1.5" fill="#1E293B"/>
  <circle cx="123" cy="190" r="1.5" fill="#1E293B"/>

  <circle cx="265" cy="185" r="22" fill="url(#kiwiGrad)"/>
  <circle cx="265" cy="185" r="9" fill="#FEF9C3"/>
  <circle cx="265" cy="178" r="1.5" fill="#1E293B"/>
  <circle cx="272" cy="185" r="1.5" fill="#1E293B"/>
  <circle cx="265" cy="192" r="1.5" fill="#1E293B"/>

  <!-- Orange Slices -->
  <path d="M 180,175 A 30,30 0 0,1 230,175 Z" fill="url(#orangeGrad)"/>
  <path d="M 155,195 A 28,28 0 0,1 205,195 Z" fill="url(#orangeGrad)"/>

  <!-- Blueberries -->
  <circle cx="195" cy="165" r="9" fill="#1E1B4B"/>
  <circle cx="193" cy="163" r="2" fill="#818CF8" opacity="0.6"/>
  <circle cx="210" cy="185" r="10" fill="#1E1B4B"/>
  <circle cx="208" cy="183" r="2" fill="#818CF8" opacity="0.6"/>
  <circle cx="175" cy="195" r="8" fill="#1E1B4B"/>

  <!-- Banana Slices -->
  <ellipse cx="160" cy="205" rx="14" ry="10" fill="#FEF08A"/>
  <ellipse cx="160" cy="205" rx="11" ry="7" fill="#FEF9C3"/>
  <ellipse cx="235" cy="200" rx="14" ry="10" fill="#FEF08A"/>
  <ellipse cx="235" cy="200" rx="11" ry="7" fill="#FEF9C3"/>

  <!-- Almonds / Nuts -->
  <ellipse cx="195" cy="210" rx="12" ry="6" fill="#78350F" transform="rotate(-15 195 210)"/>
  <ellipse cx="215" cy="212" rx="11" ry="5.5" fill="#B45309" transform="rotate(20 215 212)"/>

  <!-- Bowl Highlight -->
  <path d="M 85,200 C 95,260 140,280 170,282 C 120,270 90,230 85,200 Z" fill="#FFFFFF" opacity="0.5"/>
</svg>
