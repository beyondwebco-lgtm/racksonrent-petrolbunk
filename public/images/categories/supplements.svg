<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.18)"/>
      <stop offset="70%" stop-color="rgba(15,23,42,0.04)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="scoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E409"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Soft Floor Shadow -->
  <ellipse cx="200" cy="325" rx="130" ry="22" fill="url(#shadowGrad)"/>

  <!-- Supplement Tub Lid (Dark Navy Top Lid) -->
  <g transform="translate(0, -10)">
    <path d="M 125,120 L 275,120 A 10,10 0 0 1 285,130 L 285,155 A 10,10 0 0 1 275,165 L 125,165 A 10,10 0 0 1 115,155 L 115,130 A 10,10 0 0 1 125,120 Z" fill="url(#lidGrad)"/>
    <!-- Lid Ridges -->
    <line x1="120" y1="130" x2="280" y2="130" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="145" x2="280" y2="145" stroke="#334155" stroke-width="2"/>
    <!-- Lid Top Ellipse Ring -->
    <ellipse cx="200" cy="120" rx="75" ry="12" fill="#1E293B"/>
    <ellipse cx="200" cy="120" rx="70" ry="9" fill="#0F172A"/>

    <!-- Tub Neck Collar -->
    <rect x="123" y="165" width="154" height="15" fill="#CBD5E1"/>

    <!-- Tub Body (Plain Clean Matte White Container) -->
    <path d="M 120,180 L 280,180 C 290,180 295,190 295,200 L 285,300 C 285,312 270,320 250,320 L 150,320 C 130,320 115,312 115,300 L 105,200 C 105,190 110,180 120,180 Z" fill="url(#tubGrad)"/>
    
    <!-- Clean Metallic Foil Stripe / Accent Rim -->
    <rect x="110" y="195" width="180" height="6" fill="#F4E409"/>

    <!-- Studio Side Highlight Gloss -->
    <path d="M 112,190 C 112,250 118,290 125,310 C 118,300 110,260 108,200 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Supplement Scoop (Lying beside tub on front right) -->
  <g transform="translate(230, 260) rotate(-25)">
    <!-- Scoop Shadow -->
    <ellipse cx="40" cy="35" rx="35" ry="10" fill="rgba(15,23,42,0.2)"/>
    
    <!-- Scoop Handle -->
    <rect x="10" y="15" width="70" height="14" rx="7" fill="url(#scoopGrad)"/>
    <!-- Scoop Cup Bowl -->
    <ellipse cx="80" cy="22" rx="22" ry="18" fill="url(#scoopGrad)"/>
    <ellipse cx="80" cy="22" rx="17" ry="13" fill="#EAB308"/>
    <!-- White Powder inside Scoop -->
    <ellipse cx="80" cy="22" rx="14" ry="10" fill="#FFFFFF"/>
  </g>
</svg>
