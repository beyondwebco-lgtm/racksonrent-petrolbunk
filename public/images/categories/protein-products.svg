<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.18)"/>
      <stop offset="70%" stop-color="rgba(15,23,42,0.04)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shakerBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="yellowCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E409"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Soft Floor Shadow -->
  <ellipse cx="200" cy="330" rx="145" ry="22" fill="url(#shadowGrad)"/>

  <!-- Protein Jar (Left Subject) -->
  <g transform="translate(60, 90)">
    <!-- Jar Lid -->
    <rect x="25" y="20" width="130" height="35" rx="8" fill="#020617"/>
    <ellipse cx="90" cy="20" rx="65" ry="10" fill="#1E293B"/>
    
    <!-- Jar Neck -->
    <rect x="30" y="55" width="120" height="15" fill="#334155"/>

    <!-- Jar Main Body -->
    <path d="M 15,70 L 165,70 C 175,70 180,80 180,95 L 170,215 C 170,225 155,235 135,235 L 45,235 C 25,235 10,225 10,215 L 0,95 C 0,80 5,70 15,70 Z" fill="url(#jarGrad)"/>
    
    <!-- Jar Accent Stripe -->
    <rect x="5" y="85" width="170" height="6" fill="#F4E409"/>

    <!-- Matte Texture Gloss Lines -->
    <path d="M 15,80 L 15,220" stroke="#475569" stroke-width="3" opacity="0.4"/>
    <path d="M 25,80 L 25,222" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- Shaker Bottle (Right Subject - Tightly Grouped Beside Jar) -->
  <g transform="translate(225, 115)">
    <!-- Shaker Shadow on Jar Base -->
    <rect x="0" y="30" width="110" height="180" rx="15" fill="rgba(15,23,42,0.15)"/>

    <!-- Shaker Flip Cap & Loop Handle -->
    <path d="M 45,0 C 35,-15 65,-15 55,0 Z" fill="#0F172A"/>
    <rect x="35" y="0" width="30" height="15" rx="4" fill="url(#yellowCap)"/>

    <!-- Shaker Screw Lid -->
    <path d="M 10,15 L 90,15 L 95,45 L 5,45 Z" fill="#0F172A"/>
    <ellipse cx="50" cy="15" rx="40" ry="6" fill="url(#yellowCap)"/>

    <!-- Shaker Tapered Bottle Body -->
    <path d="M 12,45 L 88,45 L 78,190 C 78,198 68,205 50,205 C 32,205 22,198 22,190 Z" fill="url(#shakerBodyGrad)"/>

    <!-- Measurement Ounce/ML Lines on Shaker Body -->
    <line x1="28" y1="80" x2="42" y2="80" stroke="#94A3B8" stroke-width="2"/>
    <line x1="28" y1="105" x2="48" y2="105" stroke="#94A3B8" stroke-width="2"/>
    <line x1="28" y1="130" x2="42" y2="130" stroke="#94A3B8" stroke-width="2"/>
    <line x1="28" y1="155" x2="48" y2="155" stroke="#94A3B8" stroke-width="2"/>

    <!-- Shaker Yellow Rubber Grip Ring -->
    <rect x="16" y="62" width="68" height="8" rx="4" fill="url(#yellowCap)"/>
  </g>
</svg>
