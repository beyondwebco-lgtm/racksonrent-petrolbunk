<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.18)"/>
      <stop offset="70%" stop-color="rgba(15,23,42,0.04)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E409"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Soft Floor Shadow -->
  <ellipse cx="200" cy="320" rx="145" ry="24" fill="url(#shadowGrad)"/>

  <!-- Foam Yoga Block (Positioned at back right) -->
  <g transform="translate(210, 155) rotate(15)">
    <!-- Yoga Block Shadow -->
    <rect x="5" y="10" width="120" height="80" rx="8" fill="rgba(15,23,42,0.2)"/>
    <!-- Top Face -->
    <path d="M 15,0 L 115,0 L 130,20 L 30,20 Z" fill="#FDE047"/>
    <!-- Front Face -->
    <rect x="0" y="20" width="100" height="60" rx="6" fill="url(#blockGrad)"/>
    <!-- Side Face -->
    <path d="M 100,20 L 130,20 L 130,75 L 100,80 Z" fill="#CA8A04"/>
    <!-- Beveled Edge Line -->
    <line x1="0" y1="20" x2="100" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Rolled Yoga Mat (Main Central Diagonal Subject) -->
  <g transform="translate(60, 120) rotate(-22)">
    <!-- Main Rolled Cylinder -->
    <rect x="0" y="30" width="280" height="70" rx="35" fill="url(#matGrad)"/>

    <!-- Spiral Roll Ends (Left Tip Ellipse) -->
    <ellipse cx="35" cy="65" rx="35" ry="35" fill="#0F172A"/>
    <!-- Spiral Ring Inner Rolls -->
    <ellipse cx="35" cy="65" rx="27" ry="27" fill="#1E293B"/>
    <ellipse cx="35" cy="65" rx="18" ry="18" fill="#334155"/>
    <ellipse cx="35" cy="65" rx="10" ry="10" fill="#475569"/>
    <ellipse cx="35" cy="65" rx="4" ry="4" fill="#020617"/>

    <!-- Mat Texture Ribbing Lines -->
    <path d="M 40,32 L 270,32" stroke="#475569" stroke-width="2" opacity="0.5"/>
    <path d="M 40,48 L 275,48" stroke="#475569" stroke-width="2" opacity="0.5"/>
    <path d="M 40,65 L 280,65" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
    <path d="M 40,82 L 275,82" stroke="#0F172A" stroke-width="2" opacity="0.6"/>

    <!-- Carrying Straps (Wrapped around the rolled mat) -->
    <!-- Left Strap -->
    <rect x="80" y="27" width="18" height="76" rx="6" fill="url(#strapGrad)"/>
    <!-- Right Strap -->
    <rect x="200" y="27" width="18" height="76" rx="6" fill="url(#strapGrad)"/>
    <!-- Connecting Carry Handle Strap -->
    <path d="M 89,27 C 89,-15 209,-15 209,27" fill="none" stroke="url(#strapGrad)" stroke-width="12"/>
  </g>
</svg>
