<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.18)"/>
      <stop offset="70%" stop-color="rgba(15,23,42,0.04)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="towelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F4E409"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Soft Floor Shadow -->
  <ellipse cx="200" cy="330" rx="145" ry="22" fill="url(#shadowGrad)"/>

  <!-- Rolled Fitness Towel (Positioned at Back Left) -->
  <g transform="translate(65, 160) rotate(-15)">
    <!-- Towel Cylinder Body -->
    <rect x="0" y="30" width="160" height="70" rx="35" fill="url(#towelGrad)"/>
    <!-- Towel Spiral End -->
    <ellipse cx="35" cy="65" rx="35" ry="35" fill="#E2E8F0"/>
    <ellipse cx="35" cy="65" rx="26" ry="26" fill="#F1F5F9"/>
    <ellipse cx="35" cy="65" rx="16" ry="16" fill="#E2E8F0"/>
    <ellipse cx="35" cy="65" rx="8" ry="8" fill="#CBD5E1"/>
    <!-- Towel Fabric Soft Ribbing -->
    <path d="M 40,40 L 155,40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 40,65 L 155,65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 40,90 L 155,90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Reusable Steel Water Bottle (Main Center Right Subject) -->
  <g transform="translate(195, 95)">
    <!-- Shadow under Bottle -->
    <rect x="15" y="40" width="70" height="190" rx="15" fill="rgba(15,23,42,0.15)"/>

    <!-- Bottle Cap & Loop -->
    <path d="M 35,0 L 65,0 C 72,0 75,8 75,15 L 75,25 C 75,32 72,38 65,38 L 35,38 C 28,38 25,32 25,25 L 25,15 C 25,8 28,0 35,0 Z" fill="#F4E409"/>
    <rect x="42" y="-12" width="16" height="14" rx="3" fill="#0F172A"/>

    <!-- Bottle Neck -->
    <rect x="30" y="38" width="40" height="15" fill="#334155"/>

    <!-- Bottle Body (Sleek Matte Navy Metal Body) -->
    <path d="M 12,53 C 20,53 25,56 25,65 L 18,220 C 18,230 30,235 50,235 C 70,235 82,230 82,220 L 75,65 C 75,56 80,53 88,53 Z" fill="url(#bottleGrad)"/>

    <!-- Stainless Steel Rim Accent -->
    <rect x="23" y="53" width="54" height="6" fill="#F4E409"/>

    <!-- Studio Side Highlight -->
    <path d="M 24,65 L 22,215" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Textured Massage Ball (Front Center Subject - Tightly Grouped) -->
  <g transform="translate(130, 240)">
    <!-- Ball Shadow -->
    <ellipse cx="40" cy="55" rx="35" ry="12" fill="rgba(15,23,42,0.25)"/>
    <!-- Main Massage Ball -->
    <circle cx="40" cy="40" r="38" fill="url(#ballGrad)"/>
    
    <!-- Spiky Massage Nodes / Texture Dots -->
    <circle cx="28" cy="25" r="4" fill="#FEF08A"/>
    <circle cx="45" cy="22" r="4" fill="#FEF08A"/>
    <circle cx="58" cy="32" r="4" fill="#EAB308"/>
    <circle cx="22" cy="42" r="4" fill="#FEF08A"/>
    <circle cx="38" cy="42" r="4.5" fill="#FFFFFF"/>
    <circle cx="55" cy="46" r="4" fill="#EAB308"/>
    <circle cx="30" cy="58" r="4" fill="#EAB308"/>
    <circle cx="48" cy="60" r="4" fill="#CA8A04"/>
  </g>
</svg>
